name: .NET WPF CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x' 

    - name: Restore dependencies
      run: dotnet restore NoteManagerSystem.sln

    - name: Build project
      run: dotnet build NoteManagerSystem.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test NoteManagerSystem.sln --configuration Release --no-build --verbosity normal

    - name: Publish Application
      run: dotnet publish NoteManager.csproj -c Release -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NoteManager-App
        path: ./publish
