name: .NET WPF CI/CD

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x' 

    - name: Build Project
      # Звертаємося прямо в папку з реальною програмою
      run: dotnet build NoteManager/NoteManager.csproj -c Release

    - name: Run Unit Tests
      # Звертаємося прямо в папку з тестами
      run: dotnet test NoteManager.Tests/NoteManager.Tests.csproj -c Release

    - name: Publish Application
      run: dotnet publish NoteManager/NoteManager.csproj -c Release -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NoteManager-App
        path: ./publish
